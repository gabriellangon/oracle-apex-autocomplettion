<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup">
        <div class="header">
            <img src="icons/icon-48.png" alt="" class="logo">
            <h1>APEX Autocomplete</h1>
        </div>

        <div class="settings-card">
            <div class="setting-row">
                <label for="completion-case">Completion case</label>
                <select id="completion-case">
                    <option value="upper">Uppercase</option>
                    <option value="lower">Lowercase</option>
                </select>
            </div>
        </div>

        <div id="status" class="status">Detecting editors…</div>

        <div id="editors-list" class="editors-list"></div>

        <div id="no-editors" class="empty" style="display:none">
            <p>No Monaco editors detected on this page.</p>
            <p class="hint">Open an APEX page with a code editor and try again.</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
